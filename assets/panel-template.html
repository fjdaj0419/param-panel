<h2 class="sr-only">参数调节面板：先勾选要调整的参数或自行添加，再用进度条或数字输入精确调节，实时查看当前值与调整后值的对照以及最终效果预览</h2>
<style>
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.pp{font-family:var(--font-sans);color:var(--color-text-primary);font-size:13px;line-height:1.6}
.pp .hd{font-weight:500;font-size:15px;margin-bottom:2px}
.pp .sub{color:var(--color-text-secondary);margin-bottom:10px}
.pp .step{font-size:11px;letter-spacing:.5px;color:var(--color-text-tertiary);margin:12px 0 7px}
.pp .picks{display:flex;flex-wrap:wrap;gap:6px}
.pp .pick{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);cursor:pointer;background:var(--color-background-secondary)}
.pp .pick input{margin:0}
.pp .pick .cur{color:var(--color-text-tertiary);font-size:11px}
.pp .custom{display:flex;gap:6px;margin-top:8px}
.pp .custom input{flex:1;min-width:0;font-size:12px;padding:6px 8px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary)}
.pp .custom button,.pp .mini{font-size:12px;padding:6px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);cursor:pointer;white-space:nowrap}
.pp .grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:18px;align-items:start}
.pp .row{padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.pp .row.off{opacity:.35;pointer-events:none}
.pp .row .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:5px}
.pp .row .top b{font-weight:500}
.pp .row .nums{font-size:11px;color:var(--color-text-secondary);white-space:nowrap}
.pp .row .nums em{font-style:normal;color:var(--color-text-primary);font-weight:500}
.pp .row .ctl{display:flex;align-items:center;gap:8px}
.pp input[type=range]{flex:1;min-width:0;accent-color:var(--color-text-primary);height:18px;cursor:pointer}
.pp input[type=number]{width:64px;flex:0 0 auto;font-size:12px;padding:4px 6px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-primary);color:var(--color-text-primary);text-align:right}
.pp .segs{display:flex;gap:3px;flex-wrap:wrap}
.pp .segs button{font-size:11px;padding:4px 8px;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-secondary);cursor:pointer}
.pp .segs button.on{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
.pp .diff{font-size:11px}
.pp .diff .drow{display:flex;justify-content:space-between;gap:6px;padding:3px 0;border-bottom:0.5px solid var(--color-border-tertiary)}
.pp .diff .drow b{font-weight:500;text-align:right}
.pp .stage{background:var(--color-background-tertiary);border-radius:var(--border-radius-lg);padding:12px;min-height:200px}
.pcard{--bg:#F4F3EF;--fg:#2C2C2A;--sub:#888780;--chip:#E7E5DE;--ac:#444441;--afg:#FFFFFF;background:var(--bg);color:var(--fg);border-radius:14px;padding:16px;transition:background .12s,border-radius .12s}
.pcard .bd{display:none;font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;background:var(--ac);color:var(--afg);margin-bottom:8px}
.pcard .kc{font-size:11px;letter-spacing:1px;color:var(--sub);margin-bottom:4px}
.pcard .tt{font-size:16px;font-weight:500;margin-bottom:4px}
.pcard .ds{font-size:12px;color:var(--sub);margin-bottom:12px}
.pcard .cs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.pcard .ci{font-size:11px;padding:3px 9px;border-radius:6px;background:var(--chip)}
.pcard .bw{height:6px;border-radius:3px;background:var(--chip);margin-bottom:10px;overflow:hidden}
.pcard .br{height:100%;background:var(--ac);border-radius:3px;transition:width .12s,margin-left .12s}
.pcard .ft{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pcard .pl{font-size:11px;color:var(--sub)}
.pcard .bt{font-size:12px;font-weight:500;padding:7px 14px;border-radius:7px;background:var(--ac);color:var(--afg);white-space:nowrap}
.pp .acts{display:flex;gap:8px;margin-top:14px}
.pp .acts button{flex:1;font-size:13px;font-weight:500;padding:8px 10px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:transparent;color:var(--color-text-primary);cursor:pointer;white-space:nowrap}
.pp .acts .ok{background:var(--color-text-primary);color:var(--color-background-primary);border-color:var(--color-text-primary)}
</style>
<div class="pp" id="pp">
  <div class="hd" id="hd"></div>
  <div class="sub" id="sub"></div>
  <div class="step">第一步 · 选参数（可勾选，也可自己加）</div>
  <div class="picks" id="picks"></div>
  <div class="custom"><input type="text" id="cust" placeholder="自定义参数名，如：阴影强度"><button type="button" id="add">添加参数</button></div>
  <div class="grid">
    <div>
      <div class="step">第二步 · 调数值（拖动进度条或手动输入）</div>
      <div id="ctrls"></div>
    </div>
    <div>
      <div class="step">变更对照</div>
      <div class="diff" id="diff"></div>
      <div class="step">最终效果预览</div>
      <div class="stage"><div class="pcard" id="pcard">
        <div class="bd" id="pbadge">限时</div>
        <div class="kc" id="pkick">SUMMER 2026</div>
        <div class="tt" id="pttl">夏日特惠</div>
        <div class="ds" id="pdsc">全场通用券 · 限时领取</div>
        <div class="cs" id="pchips"></div>
        <div class="bw"><div class="br" id="pbar"></div></div>
        <div class="ft"><span class="pl" id="pprice">价格区间</span><span class="bt" id="pbtn">立即查看</span></div>
      </div></div>
    </div>
  </div>
  <div class="acts"><button type="button" id="rst">↺ 重置推荐</button><button type="button" class="ok" id="ok">确认，就按这个做 ↗</button></div>
</div>
<script>
/* ============================================================
   参数调节面板 v7 —— 宿主兼容版
   关键约束：宿主降级路径的 scoped document 没有 createElement /
   createTextNode 等原型方法，所以本脚本【绝不使用】这两个 API，
   所有 DOM 一律通过元素的 innerHTML 字符串生成；事件用
   addEventListener 绑定（iframe CSP 禁内联 onclick）。
   ============================================================ */
const CFG={
  title:'夏日活动页 · 外观微调',
  sub:'先勾选要调的参数（也能自己加），再拖动进度条或输入数值，右侧实时预览。',
  kicker:'SUMMER 2026',titleText:'夏日特惠',desc:'全场通用券 · 限时领取',buttonText:'立即查看',
  chips:['轻量','包邮','可退'],
  params:[
    {id:'tone',name:'配色风格',type:'segment',current:'极简灰',recommended:'极简灰',options:['极简灰','夜间','珊瑚'],on:true},
    {id:'radius',name:'圆角大小',type:'number',current:14,recommended:14,min:0,max:24,step:1,unit:'px',on:true},
    {id:'gap',name:'元素间距',type:'number',current:8,recommended:8,min:4,max:20,step:1,unit:'px',on:false},
    {id:'badge',name:'限时徽章',type:'switch',current:false,recommended:false,on:false},
    {id:'pmin',name:'价格下限',type:'number',current:100,recommended:200,min:0,max:1000,step:50,unit:'¥',prefixUnit:true,on:true},
    {id:'pmax',name:'价格上限',type:'number',current:900,recommended:800,min:0,max:1000,step:50,unit:'¥',prefixUnit:true,on:true}
  ],
  preview(v){
    const T={'极简灰':['#F4F3EF','#2C2C2A','#888780','#E7E5DE','#444441','#FFFFFF'],'夜间':['#1C1C1E','#F5F5F7','#9A9AA0','#2E2E31','#FF9F0A','#1C1C1E'],'珊瑚':['#FFF1EA','#4A1B0C','#A25C3E','#F5C4B3','#D85A30','#FFFFFF']};
    const t=T[v.tone]||T['极简灰'];
    return {bg:t[0],fg:t[1],sub:t[2],chip:t[3],ac:t[4],afg:t[5],
      radius:(v.radius||0)+'px',gap:(v.gap||8)+'px',badge:!!v.badge,
      barL:((v.pmin||0)/1000*100)+'%',barW:(Math.max(0,(v.pmax||0)-(v.pmin||0))/1000*100)+'%',
      price:'¥'+(v.pmin||0)+' – ¥'+(v.pmax||0)};
  }
};
const $=id=>document.getElementById(id);
const ST={v:{},on:{}};
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}
function fmt(p,v){if(p.type==='switch')return v?'开':'关';if(p.type==='segment')return v;return p.prefixUnit?(p.unit||'')+v:v+(p.unit||'')}
function fmtD(p,d){const x=Math.round(d*10)/10;if(Math.abs(x)<1e-9)return '0';const sign=x>0?'+':'-',a=Math.abs(x);return sign+(p.prefixUnit?(p.unit||'')+a:a+(p.unit||''))}

/* 用 innerHTML 一次性生成所有勾选框（不碰 createElement） */
function renderPicks(){
  let h='';
  CFG.params.forEach((p,i)=>{
    h+='<label class="pick"><input type="checkbox" data-pick="'+i+'"'+(ST.on[p.id]?' checked':'')+'><span>'+esc(p.name)+'</span><span class="cur">当前 '+esc(fmt(p,p.current))+'</span></label>';
  });
  $('picks').innerHTML=h;
  const boxes=$('picks').querySelectorAll('input[data-pick]');
  for(let i=0;i<boxes.length;i++){
    boxes[i].addEventListener('change',function(){ST.on[CFG.params[i].id]=this.checked;sync()});
  }
}

/* 用 innerHTML 一次性生成所有控件行（不碰 createElement） */
function renderCtrls(){
  let h='';
  CFG.params.forEach((p,i)=>{
    h+='<div class="row" data-row="'+esc(p.id)+'"><div class="top"><b>'+esc(p.name)+'</b><span class="nums" data-nums="'+esc(p.id)+'"></span></div><div class="ctl">';
    if(p.type==='number'){
      h+='<input type="range" data-r="'+esc(p.id)+'" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+ST.v[p.id]+'"><input type="number" data-n="'+esc(p.id)+'" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+ST.v[p.id]+'">';
    }else if(p.type==='segment'){
      h+='<div class="segs" data-seg="'+esc(p.id)+'">';
      p.options.forEach(o=>{h+='<button type="button" data-v="'+esc(o)+'">'+esc(o)+'</button>'});
      h+='</div>';
    }else{
      h+='<button type="button" class="mini" data-sw="'+esc(p.id)+'"></button>';
    }
    h+='</div></div>';
  });
  $('ctrls').innerHTML=h;

  CFG.params.forEach(p=>{
    if(p.type==='number'){
      const r=$('ctrls').querySelector('[data-r="'+p.id+'"]');
      const n=$('ctrls').querySelector('[data-n="'+p.id+'"]');
      if(r)r.addEventListener('input',function(){set(p.id,this.value)});
      if(n)n.addEventListener('input',function(){set(p.id,this.value)});
    }else if(p.type==='segment'){
      const box=$('ctrls').querySelector('[data-seg="'+p.id+'"]');
      if(box){const bs=box.querySelectorAll('button');for(let i=0;i<bs.length;i++){bs[i].addEventListener('click',function(){set(p.id,this.getAttribute('data-v'))})}}
    }else{
      const sw=$('ctrls').querySelector('[data-sw="'+p.id+'"]');
      if(sw)sw.addEventListener('click',function(){set(p.id,!ST.v[p.id])});
    }
  });
}
function set(id,v){
  const p=CFG.params.find(x=>x.id===id);if(!p)return;
  if(p.type==='number'){
    v=Math.max(p.min,Math.min(p.max,Number(v)||0));
    const r=$('ctrls').querySelector('[data-r="'+id+'"]'),n=$('ctrls').querySelector('[data-n="'+id+'"]');
    if(r)r.value=v;if(n)n.value=v;
  }else if(p.type==='switch'){v=!!v}
  ST.v[id]=v;sync();
}
function sync(){
  CFG.params.forEach(p=>{
    const v=ST.v[p.id];
    const row=$('ctrls').querySelector('[data-row="'+p.id+'"]');
    if(row){if(ST.on[p.id])row.classList.remove('off');else row.classList.add('off')}
    const nums=$('ctrls').querySelector('[data-nums="'+p.id+'"]');
    if(nums){
      const dt=p.type==='number'?fmtD(p,v-p.current):(v===p.current?'无变化':'已改变');
      nums.innerHTML='当前 '+esc(fmt(p,p.current))+' · <em>调整后 '+esc(fmt(p,v))+'</em> <span style="color:var(--color-text-tertiary)">'+esc(dt)+'</span>';
    }
    if(p.type==='segment'){
      const box=$('ctrls').querySelector('[data-seg="'+p.id+'"]');
      if(box){const bs=box.querySelectorAll('button');for(let i=0;i<bs.length;i++){if(bs[i].getAttribute('data-v')===v)bs[i].classList.add('on');else bs[i].classList.remove('on')}}
    }
    if(p.type==='switch'){
      const sw=$('ctrls').querySelector('[data-sw="'+p.id+'"]');
      if(sw)sw.textContent=v?'已开启 · 点击关闭':'未开启 · 点击开启';
    }
  });
  renderDiff();applyPreview();
}
function vals(){const o={};CFG.params.forEach(p=>o[p.id]=ST.v[p.id]);return o}
function renderDiff(){
  let h='',any=false;
  CFG.params.forEach(p=>{
    if(!ST.on[p.id])return;
    const v=ST.v[p.id];
    const ch=p.type==='number'?Math.abs(v-p.current)>1e-9:v!==p.current;
    if(!ch)return;any=true;
    h+='<div class="drow"><span>'+esc(p.name)+'</span><b>'+esc(fmt(p,p.current)+' → '+fmt(p,v)+(p.type==='number'?' ('+fmtD(p,v-p.current)+')':''))+'</b></div>';
  });
  if(!any)h+='<div class="drow"><span>暂无变更</span><b>调整数值后显示</b></div>';
  $('diff').innerHTML=h;
}
function applyPreview(){
  const d=CFG.preview(vals()),c=$('pcard');
  c.style.setProperty('--bg',d.bg);c.style.setProperty('--fg',d.fg);c.style.setProperty('--sub',d.sub);
  c.style.setProperty('--chip',d.chip);c.style.setProperty('--ac',d.ac);c.style.setProperty('--afg',d.afg);
  c.style.borderRadius=d.radius;$('pchips').style.gap=d.gap;
  $('pbadge').style.display=d.badge?'inline-block':'none';
  $('pbar').style.marginLeft=d.barL;$('pbar').style.width=d.barW;
  $('pprice').textContent=d.price;
}
function init(){
  $('hd').textContent=CFG.title;$('sub').textContent=CFG.sub;
  $('pkick').textContent=(CFG.kicker||'SUMMER 2026');
  $('pttl').textContent=(CFG.titleText||'夏日特惠');
  $('pdsc').textContent=(CFG.desc||'全场通用券 · 限时领取');
  $('pbtn').textContent=(CFG.buttonText||'立即查看');
  $('pchips').innerHTML=(CFG.chips||[]).map(x=>'<span class="ci">'+esc(x)+'</span>').join('');
  CFG.params.forEach(p=>{ST.v[p.id]=p.recommended;ST.on[p.id]=!!p.on});
  renderPicks();renderCtrls();sync();
}
$('add').addEventListener('click',()=>{
  const n=$('cust').value.trim();if(!n)return;
  const id='c'+Date.now();
  CFG.params.push({id,name:n,type:'number',current:50,recommended:50,min:0,max:100,step:1,unit:'',on:true,custom:true});
  ST.v[id]=50;ST.on[id]=true;$('cust').value='';
  renderPicks();renderCtrls();sync();
});
$('rst').addEventListener('click',()=>{CFG.params.forEach(p=>{ST.v[p.id]=p.recommended});renderCtrls();sync()});
$('ok').addEventListener('click',()=>{
  const L=[];
  CFG.params.forEach(p=>{
    if(!ST.on[p.id])return;
    const v=ST.v[p.id];
    L.push('已确认：'+p.name+' = '+fmt(p,v)+'（当前 '+fmt(p,p.current)+(p.type==='number'?'，变化 '+fmtD(p,v-p.current):'')+'）。请据此继续生成。');
  });
  if(typeof sendPrompt==='function')sendPrompt(L.join('\n'));
});
init();
</script>
